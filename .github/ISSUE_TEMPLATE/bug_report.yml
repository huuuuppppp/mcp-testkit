name: Bug report
description: Report something that doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: input
    id: version
    attributes:
      label: mcp-testkit version
      description: Run `npx mcp-testkit --version` or check package.json.
    validations:
      required: true
  - type: input
    id: sdk-version
    attributes:
      label: @modelcontextprotocol/sdk version
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
    validations:
      required: true
  - type: input
    id: test-runner
    attributes:
      label: Test runner
      description: e.g. vitest 2.1, jest 29, node:test, bun test.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: A minimal code sample or repository that reproduces the issue.
      placeholder: |
        const kit = await createTestKit(server);
        await kit.callTool("...", {...});
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message and stack trace if any.
    validations:
      required: true
